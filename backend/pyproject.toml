[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chati"
version = "0.1.0"
description = "Chati, le Chat Insoumis — assistant RAG sourcé"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "openai", "numpy", "firebase-admin", "fastembed"]

[tool.setuptools.packages.find]
include = ["chati*"]
